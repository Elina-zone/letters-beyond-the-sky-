
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Letters Beyond the Sky</title>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <div class="login-page">

        <a href="index.html" class="back-home">← Back to Home</a>

        <div class="login-card">

            <div class="login-star">✧</div>

            <h1>Join Our Little World</h1>

            <p class="login-subtitle">
                Create an account and let your words travel.
            </p>

            <form id="signupForm">

                <label for="signupEmail">Email Address</label>
                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="signupPassword">Password</label>
                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="8"
                    required
                >

                <button type="submit">Create Account ✦</button>

            </form>

            <p class="signup-text">
                Already have an account?
                <a href="login.html">Sign In</a>
            </p>

            <p class="login-footer">
                ✦ Some words are meant to travel. ✦
            </p>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
