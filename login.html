
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Letters Beyond the Sky</title>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <div class="login-page">

        <a href="index.html" class="back-home">← Back to Home</a>

        <div class="login-card">

            <div class="login-star">✦</div>

            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Your little corner among the stars is waiting.
            </p>

            <form id="loginForm">

                <label for="loginEmail">Email Address</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Sign In ✧</button>

            </form>

            <p class="signup-text">
                New to this little world?
                <a href="signup.html">Create an account</a>
            </p>

            <p class="login-footer">
                ✦ Some words are meant to travel. ✦
            </p>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
